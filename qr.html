<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Check</title>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<!-- MAIN CARD -->
<div class="card p-4 sm:p-6 max-w-md w-full mx-auto">

  <!-- HEADER -->
  <div class="text-center mb-5">
    <h2 class="text-lg font-bold flex items-center justify-center gap-2">
      <i class="fas fa-qrcode text-red-500"></i>
      QR Code Lookup
    </h2>
    <p class="text-sm opacity-60">Search and generate vehicle QR pass</p>
  </div>

  <!-- INPUT -->
  <div class="relative mb-3">
    <i class="fas fa-id-card absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>

    <input id="searchId" type="text" placeholder="Enter Staff / Student ID"
      class="w-full rounded-lg p-3 pl-10 text-base">
  </div>

  <!-- PASSWORD -->
  <div class="relative mb-3">
    <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>

    <input id="userPassword" type="password" placeholder="Enter Password"
      class="w-full rounded-lg p-3 pl-10 text-base">
  </div>

  <!-- SEARCH BUTTON -->
  <button id="searchBtn" onclick="searchUser()"
    class="w-full py-3 rounded-lg bg-red-500 text-white font-semibold flex justify-center items-center gap-2">

    <i class="fas fa-search"></i>
    Search
  </button>

  <!-- FEEDBACK -->
  <div id="feedback" class="text-center text-sm mt-3"></div>

  <!-- RESULT BOX -->
  <div id="resultBox" class="hidden mt-5">

    <div class="glass-inner p-5 text-center">

      <h3 class="text-base font-semibold mb-3 flex items-center justify-center gap-2">
        <i class="fas fa-id-badge text-red-500"></i>
        Digital Parking Pass
      </h3>

      <p id="resultName" class="font-semibold text-lg"></p>

      <p class="text-sm opacity-60 mb-3">
        Select a vehicle to generate QR
      </p>

      <!-- VEHICLES -->
      <div id="vehicleSection" class="hidden text-left mb-4">
        <p class="text-sm font-semibold mb-2">Vehicles</p>
        <div id="vehicleList" class="space-y-2"></div>
      </div>

      <!-- QR -->
      <div class="flex justify-center mb-4">
        <canvas id="resultQR" class="p-2 rounded-lg"></canvas>
      </div>

      <p id="resultPlate" class="text-sm font-semibold"></p>

      <!-- DOWNLOAD -->
      <button id="downloadQR"
        class="w-full py-3 rounded-lg bg-black text-white mt-3 hidden">
        <i class="fas fa-download"></i>
        Download QR Code
      </button>

      <p class="text-xs opacity-50 mt-3">
        Show this QR at the entrance
      </p>

    </div>
  </div>
</div>

<script type="module">
let currentUser = null;
let selectedVehicle = null;

// SEARCH USER (tu liga isto ao teu backend depois)
window.searchUser = async function () {

  const id = document.getElementById("searchId").value;

  // EXEMPLO MOCK (substitui pelo Supabase)
  currentUser = {
    id: "user-123",
    name: "John Doe",
    vehicles: [
      { id: "v1", plate_number: "ABC-123", make: "Toyota", color: "Black" },
      { id: "v2", plate_number: "XYZ-999", make: "BMW", color: "White" }
    ]
  };

  document.getElementById("resultBox").classList.remove("hidden");
  document.getElementById("resultName").innerText = currentUser.name;

  renderVehicles(currentUser.vehicles);
};

// RENDER VEHICLES
function renderVehicles(vehicles) {
  const container = document.getElementById("vehicleList");
  container.innerHTML = "";

  document.getElementById("vehicleSection").classList.remove("hidden");

  vehicles.forEach(v => {
    const div = document.createElement("div");

    div.className = `
      p-3 rounded-lg border cursor-pointer
      hover:bg-red-500/10 transition
    `;

    div.innerHTML = `
      <div class="font-semibold">${v.plate_number}</div>
      <div class="text-xs opacity-60">${v.make} ${v.color}</div>
    `;

    div.onclick = () => selectVehicle(v);

    container.appendChild(div);
  });
}

// SELECT VEHICLE
function selectVehicle(vehicle) {
  selectedVehicle = vehicle;

  const payload = {
    type: "moventra_vehicle",
    user_id: currentUser.id,
    vehicle_id: vehicle.id,
    plate: vehicle.plate_number
  };

  QRCode.toCanvas(
    document.getElementById("resultQR"),
    JSON.stringify(payload),
    { width: 200 }
  );

  document.getElementById("resultPlate").innerText =
    vehicle.plate_number;

  document.getElementById("downloadQR").classList.remove("hidden");
}

// DOWNLOAD QR
document.getElementById("downloadQR").onclick = function () {
  const canvas = document.getElementById("resultQR");
  const link = document.createElement("a");

  link.download = "moventra_qr.png";
  link.href = canvas.toDataURL();
  link.click();
};

</script>

</body>
</html>
